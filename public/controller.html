<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake – Controller</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; touch-action:manipulation; user-select:none; }
  body { background:#222; color:#fff; font-family:system-ui,sans-serif; }
  #pad { position:relative; height:100%; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; text-align:center; }
  #arrow { font-size:34vmin; line-height:1; }
  #label { font-size:7vmin; font-weight:700; }
  #hint { font-size:4vmin; opacity:.8; padding:0 16px; }

  /* One colored zone per direction: the whole screen for 1 direction, two halves for 2. */
  #zones { position:absolute; inset:0; display:flex; }
  #zones[hidden] { display:none; }
  #zones.col { flex-direction:column; }
  .zone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
          transition:filter .1s; }
  .zone .arrow { font-size:24vmin; line-height:1; }
  #zones.single .zone .arrow { font-size:34vmin; }
  .zone .name { font-size:7vmin; font-weight:700; }
  .zone.up    { background:#1e66f5; }
  .zone.down  { background:#e5322d; }
  .zone.left  { background:#f5c518; color:#222; }
  .zone.right { background:#2fb344; }
  .zone.flash { filter:brightness(1.35); }

  #pad.over #zones, #pad.over #arrow, #pad.over #label, #pad.over #hint { display:none; }
  #gameover { width:min(360px, 90vw); display:flex; flex-direction:column; gap:12px; align-items:center; }
  #gameover[hidden] { display:none; }
  #gameover h1 { margin:0; font-size:9vmin; }
  #goScore { font-size:6vmin; font-weight:700; }
  #goRank { font-size:4.5vmin; opacity:.9; }
  #nameRow { display:flex; gap:8px; width:100%; }
  #nameRow[hidden] { display:none; }
  #nameInput { flex:1; min-width:0; font:inherit; font-size:5vmin; padding:10px; border-radius:8px;
               border:2px solid rgba(0,0,0,.35); background:#fff; color:#111; text-align:center;
               -webkit-user-select:text; user-select:text; }
  #gameover button { font:inherit; font-size:5vmin; padding:10px 20px; border:0; border-radius:8px;
                     background:#fff; color:#111; cursor:pointer; }
  #again { width:100%; font-weight:700; }
</style>
</head>
<body>
<div id="pad">
  <div id="zones" hidden></div>
  <div id="arrow">…</div>
  <div id="label">Connecting…</div>
  <div id="hint"></div>
  <div id="gameover" hidden>
    <h1>Game over</h1>
    <div id="goScore"></div>
    <div id="goRank"></div>
    <div id="nameRow">
      <input id="nameInput" maxlength="20" autocomplete="off" spellcheck="false" aria-label="Team name">
      <button id="saveBtn">Save</button>
    </div>
    <button id="again">Play again</button>
  </div>
</div>
<script>
const pad = document.getElementById('pad');
const zones = document.getElementById('zones');
const $ = (id) => document.getElementById(id);
const INFO = {
  up:    ['⬆', 'UP'],
  down:  ['⬇', 'DOWN'],
  left:  ['⬅', 'LEFT'],
  right: ['➡', 'RIGHT'],
};
let ws;
let myDirs = [];
let status = 'waiting';
let editedId = null; // id of the score whose name is shown in the input

// Order and orientation of the zones for the directions this phone controls.
function zoneLayout(dirs) {
  if (dirs.length === 1) return { order: dirs, column: false };
  if (dirs.includes('up') && dirs.includes('down')) return { order: ['up', 'down'], column: true };
  if (dirs.includes('left') && dirs.includes('right')) return { order: ['left', 'right'], column: false };
  // Mixed pair (e.g. up + left): the horizontal direction goes on its own side.
  const horizontal = dirs.find((d) => d === 'left' || d === 'right');
  const vertical = dirs.find((d) => d === 'up' || d === 'down');
  return { order: horizontal === 'left' ? [horizontal, vertical] : [vertical, horizontal], column: false };
}

function showDirections(dirs) {
  myDirs = dirs;
  const { order, column } = zoneLayout(dirs);
  zones.replaceChildren();
  zones.className = (column ? 'col ' : '') + (dirs.length === 1 ? 'single' : '');
  for (const d of order) {
    const z = document.createElement('div');
    z.className = 'zone ' + d;
    z.dataset.dir = d;
    z.innerHTML = '<div class="arrow"></div><div class="name"></div>';
    z.querySelector('.arrow').textContent = INFO[d][0];
    z.querySelector('.name').textContent = INFO[d][1];
    // small pop to signal a (re)assignment, even if the directions are unchanged
    z.querySelector('.arrow').animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], 200);
    zones.appendChild(z);
  }
  zones.hidden = false;
  for (const id of ['arrow', 'label', 'hint']) $(id).style.display = 'none';
}

function showMessage(arrow, label, hint) {
  myDirs = [];
  zones.hidden = true;
  zones.replaceChildren();
  for (const id of ['arrow', 'label', 'hint']) $(id).style.display = '';
  $('arrow').textContent = arrow;
  $('label').textContent = label;
  $('hint').textContent = hint;
}

function renderGameOver(m) {
  status = m.status;
  const over = m.status === 'gameover';
  pad.classList.toggle('over', over);
  $('gameover').hidden = !over;
  if (!over) return;
  const cur = m.board && m.board.current;
  $('goScore').textContent = 'Score: ' + m.score;
  $('nameRow').hidden = !cur;
  $('goRank').textContent = cur ? 'Rank #' + cur.rank + ' – ' + (m.board.mode === 'hard' ? 'Hard' : 'Easy') : '';
  const input = $('nameInput');
  if (cur && (editedId !== cur.id || document.activeElement !== input)) {
    input.value = cur.name; // do not overwrite while the player is typing
    editedId = cur.id;
  }
}
function saveName() {
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'rename', name: $('nameInput').value }));
}
$('saveBtn').onclick = () => { saveName(); $('nameInput').blur(); };
$('nameInput').onchange = saveName;
$('nameInput').onkeydown = (e) => { if (e.key === 'Enter') e.target.blur(); };
$('again').onclick = () => ws.readyState === 1 && ws.send(JSON.stringify({ type: 'press', dir: myDirs[0] }));
// Taps inside the game-over panel must not steer or restart the game.
$('gameover').addEventListener('pointerdown', (e) => e.stopPropagation());

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'controller' }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') {
      renderGameOver(m);
    } else if (m.type === 'assigned') {
      showDirections(m.dirs);
    } else if (m.type === 'spectator') {
      showMessage('👀', 'Game full', 'All seats are taken. You will join automatically when one frees up.');
    } else if (m.type === 'event' && m.name === 'dead' && navigator.vibrate) {
      navigator.vibrate([200, 80, 200]);
    }
  };
  ws.onclose = () => {
    showMessage('…', 'Reconnecting…', '');
    setTimeout(connect, 1000);
  };
}

zones.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const zone = e.target.closest('.zone');
  if (!zone || ws.readyState !== 1 || status === 'gameover') return; // restart via the button
  ws.send(JSON.stringify({ type: 'press', dir: zone.dataset.dir }));
  if (navigator.vibrate) navigator.vibrate(30);
  zone.classList.add('flash');
  setTimeout(() => zone.classList.remove('flash'), 100);
});
connect();
</script>
</body>
</html>
